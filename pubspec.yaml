name: allmodiary
description: "全心日記：一天一篇的日記"
publish_to: 'none'

version: 0.1.0+10

# Every version is pinned to the latest stable release (checked on pub.dev 2026-11-11).
# Flutter is pinned to 3.47.9 (latest stable on 2026-11-11). When adding or upgrading a package,
# try the newest release first; only step back when it really doesn't work, and write down why here.
environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  # System widgets (licence page, text selection menu, date names) in Traditional Chinese.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  drift: 2.35.4
  drift_flutter: 0.3.1
  path_provider: 2.1.6
  path: 1.9.1
  # Rich-text editor for the diary body (MIT). Stores the body as a Quill Delta (JSON).
  flutter_quill: 11.6.0
  image_picker: 1.2.4
  flutter_image_compress: 2.5.1
  uuid: 4.6.0
  characters: 1.4.1
  # Terms and privacy policy are Markdown files under assets/texts/.
  flutter_markdown_plus: 1.0.12
  markdown: 7.3.1
  url_launcher: 6.3.3
  package_info_plus: 10.2.2
  google_sign_in: 7.2.0
  # Drive authorization names the remembered account (id + email) directly, so no silent sign-in is
  # needed first; google_sign_in itself doesn't expose that parameter.
  google_sign_in_platform_interface: 3.1.0
  http: 1.6.0
  # Google Drive (diary sync, images in the cloud, exports).
  googleapis: 18.0.0
  googleapis_auth: 2.3.7
  # MD5 check after uploading an image (Drive reports md5Checksum), SHA-256 for font downloads.
  crypto: 3.0.8
  # Encrypted export: AES-256-GCM (lib/services/export_crypto.dart); the Flutter plugin uses the
  # platform's native implementation.
  cryptography: 2.9.0
  cryptography_flutter: 2.3.4
  archive: 4.6.0
  # Picking an export file to import from the phone (the Drive picker isn't available to drive.file apps).
  file_picker: 13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.3
  build_runner: 2.17.1
  flutter_launcher_icons: 0.14.4
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
  assets:
    # The font licence text: SIL OFL 1.1 requires shipping it with the font. main() registers it on
    # the in-app "open source licences" page. Only this file, not all of assets/fonts/.
    - assets/fonts/OFL.txt
    - assets/texts/
  fonts:
    # Noto Sans TC (SIL Open Font License 1.1), variable weight.
    - family: NotoSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-Variable.ttf

# App icon: dart run flutter_launcher_icons
# The drawing is generated by tool/icon/make_icon.py (goose-yellow background, heart-shaped letter,
# quill); its PNG output lives in assets/icon/ (not bundled into the app). The generated launcher
# images under android/app/src/main/res/ are committed.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon_1024.png
  adaptive_icon_background: "#F6D365"
  adaptive_icon_foreground: assets/icon/adaptive_foreground_1024.png
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome_1024.png
  min_sdk_android: 30
